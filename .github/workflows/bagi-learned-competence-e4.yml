name: "BAGI G2-E4-P1: Public Learned Competence Controls"

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/learned_competence_e4.py"
      - ".github/workflows/bagi-learned-competence-e4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bagi-learned-competence-e4-p1
  cancel-in-progress: false

jobs:
  learned-competence-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing CPU Torch, Farama MiniGrid, SB3 and dev tests
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -e '.[dev,rl]'
          python -m pip check
      - name: Fail closed on synthetic native-action, seed and public-boundary contracts
        run: |
          ruff check bagi/experiments/learned_competence_e4.py tests/test_learned_competence_e4.py
          python -m pytest -q tests/test_learned_competence_e4.py
      - name: Execute ONE frozen matched learned competence pilot
        run: |
          python -m bagi.experiments.learned_competence_e4 --output-dir runs/g2_e4_p1_competence
      - name: Archive only safe numeric weights, episode actions and JSON summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-g2-e4-p1-learned-competence
          path: runs/g2_e4_p1_competence/
          if-no-files-found: warn
          retention-days: 30
