name: BAGI Inventory Observation Aliasing Audit

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_inventory_observation_audit.py"
      - "tests/test_xland_inventory_observation_audit.py"
      - "configs/xland_inventory_observation_audit.yaml"
      - ".github/workflows/bagi-inventory-observation-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reviewed upstream XLand dependencies
        run: |
          python -m pip install --no-cache-dir "xminigrid==0.9.3" "pyyaml>=6" "pytest>=8" "ruff>=0.6"
      - name: Lint and test exact public observation equality
        run: |
          ruff check bagi/experiments/xland_inventory_observation_audit.py tests/test_xland_inventory_observation_audit.py
          python -m pytest -q tests/test_xland_inventory_observation_audit.py
      - name: Compare native action outcomes at identical observable pre-drop states
        run: python -m bagi.experiments.xland_inventory_observation_audit --config configs/xland_inventory_observation_audit.yaml
      - name: Archive physical vs hidden-pocket counterfactual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-inventory-observation-aliasing
          path: runs/xland_inventory_observation_audit/summary.json
          if-no-files-found: warn
          retention-days: 30
