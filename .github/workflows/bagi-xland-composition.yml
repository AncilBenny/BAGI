name: BAGI XLand Composition Contract

# One bounded compatibility check; never scheduled or attached to repeated research runs.
on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_composition_smoke.py"
      - "tests/test_xland_composition_smoke.py"
      - "configs/xland_composition_smoke.yaml"
      - ".github/workflows/bagi-xland-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upstream XLand library (CPU)
        run: pip install "xminigrid==0.9.3" "pyyaml>=6.0" "pytest>=8.0" "ruff>=0.6"
      - name: Validate task splits and no-op rules rejection
        run: |
          ruff check bagi/experiments/xland_composition_smoke.py tests/test_xland_composition_smoke.py
          python -m pytest -q tests/test_xland_composition_smoke.py
      - name: Evaluate distinct causal task compositions with existing simulator
        env:
          JAX_PLATFORM_NAME: cpu
        run: python -m bagi.experiments.xland_composition_smoke --config configs/xland_composition_smoke.yaml
      - name: Preserve small compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-xland-composition-contract
          path: runs/xland_composition_smoke/summary.json
          if-no-files-found: warn
          retention-days: 30
