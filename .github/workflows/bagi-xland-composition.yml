name: BAGI XLand Composition Contract

# One bounded compatibility check; never scheduled or attached to repeated research runs.
on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_composition_smoke.py"
      - "tests/test_xland_composition_smoke.py"
      - "configs/xland_composition_smoke.yaml"
      - "bagi/experiments/xland_solvability_oracle.py"
      - "tests/test_xland_solvability_oracle.py"
      - "configs/xland_composition_oracle.yaml"
      - "bagi/experiments/xland_structural_composition.py"
      - "tests/test_xland_structural_composition.py"
      - "configs/xland_structural_composition.yaml"
      - "bagi/experiments/xland_action_coverage.py"
      - "tests/test_xland_action_coverage.py"
      - "configs/xland_action_coverage.yaml"
      - ".github/workflows/bagi-xland-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upstream XLand library (CPU)
        run: pip install "xminigrid==0.9.3" "pyyaml>=6.0" "pytest>=8.0" "ruff>=0.6"
      - name: Validate task splits and no-op rules rejection
        run: |
          ruff check bagi/experiments/xland_composition_smoke.py tests/test_xland_composition_smoke.py bagi/experiments/xland_solvability_oracle.py tests/test_xland_solvability_oracle.py bagi/experiments/xland_structural_composition.py tests/test_xland_structural_composition.py bagi/experiments/xland_action_coverage.py tests/test_xland_action_coverage.py tests/test_xland_action_coverage.py
          python -m pytest -q tests/test_xland_composition_smoke.py tests/test_xland_solvability_oracle.py tests/test_xland_structural_composition.py
      - name: Evaluate distinct causal task compositions with existing simulator
        env:
          JAX_PLATFORM_NAME: cpu
        run: python -m bagi.experiments.xland_composition_smoke --config configs/xland_composition_smoke.yaml
      - name: Establish privileged, deterministic task-solvability ceiling
        env:
          JAX_PLATFORM_NAME: cpu
        run: python -m bagi.experiments.xland_solvability_oracle --config configs/xland_composition_oracle.yaml
      - name: Check structurally held-out rules with upstream simulator (REUSE-6)
        env:
          JAX_PLATFORM_NAME: cpu
        run: python -m bagi.experiments.xland_structural_composition --config configs/xland_structural_composition.yaml
      - name: Validate rewarded put-down train skill and action support (REUSE-8)
        env:
          JAX_PLATFORM_NAME: cpu
        run: python -m bagi.experiments.xland_action_coverage --config configs/xland_action_coverage.yaml
      - name: Preserve small compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-xland-composition-contract
          path: |
            runs/xland_composition_smoke/summary.json
            runs/xland_composition_oracle/summary.json
            runs/xland_structural_composition/summary.json
            runs/xland_action_coverage/summary.json
          if-no-files-found: warn
          retention-days: 30
