name: BAGI Research Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: bagi-research-loop
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: setup/initial-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install BAGI
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify research platform
        run: make check

      - name: Run sample-efficiency study
        run: make sample-efficiency

      - name: Capture research metadata
        if: always()
        run: |
          mkdir -p artifacts/research-loop
          git rev-parse HEAD > artifacts/research-loop/research_branch_commit.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > artifacts/research-loop/run_utc.txt
          if [ -f runs/sample_efficiency/summary.json ]; then
            cp runs/sample_efficiency/summary.json artifacts/research-loop/summary.json
          fi
          if [ -f runs/sample_efficiency/summary.csv ]; then
            cp runs/sample_efficiency/summary.csv artifacts/research-loop/summary.csv
          fi

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-research-${{ github.run_number }}
          path: artifacts/research-loop
          if-no-files-found: warn
          retention-days: 30
