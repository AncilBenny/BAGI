name: BAGI Research Loop

# Scheduled research is admitted only after exact CI provenance and orderly branch checks.
on:
  workflow_dispatch:
    inputs:
      force_retrain:
        description: Train afresh instead of reusing evaluation/checkpoint caches
        type: boolean
        default: false
      study:
        description: "Research study to execute"
        type: choice
        required: true
        default: legacy
        options:
          - legacy
          - m1
          - m2
          - m3
          - m4
          - m5
          - m6
          - m7
          - m8
          - m9
          - m10
          - m10p1
          - m11
          - m12
          - m13
          - m14
          - m15
          - m16
          - m17
          - m18
  schedule:
    - cron: "17 * * * *"
  # Branch-only explicit one-shot studies; no duplicate workflow.
  push:
    branches: [setup/initial-platform]
    paths:
      - .github/bagi-m1-once.json
      - .github/bagi-m2-once.json
      - .github/bagi-m3-once.json
      - .github/bagi-m4-once.json
      - .github/bagi-m5-once.json
      - .github/bagi-m6-once.json
      - .github/bagi-m6-repair-once.json
      - .github/bagi-m7-once.json
      - .github/bagi-m8-once.json
      - .github/bagi-m9-once.json
      - .github/bagi-m10-once.json
      - .github/bagi-m10p1-once.json
      - .github/bagi-m11-once.json
      - .github/bagi-m12-once.json
      - .github/bagi-m13-once.json
      - .github/bagi-m14-once.json
      - .github/bagi-m15-once.json
      - .github/bagi-m15-repair-once.json
      - .github/bagi-m16-once.json
      - .github/bagi-m17-once.json
      - .github/bagi-m18-once.json

permissions:
  contents: read

concurrency:
  group: bagi-research-loop
  cancel-in-progress: false

jobs:
  audit:
    outputs:
      research_sha: ${{ steps.verify.outputs.research_sha }}
      study: ${{ steps.mode.outputs.study }}
    name: Verify current source and PR merge CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fail closed on missing or unknown manual study
        id: mode
        env:
          BAGI_DISPATCH_STUDY: ${{ inputs.study }}
        run: python3 scripts/bagi_research_dispatch.py

      - name: Await new exact-HEAD CI for one-shot push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.sha }}
        run: python3 scripts/bagi_wait_for_research_ci.py

      - name: Check both CI events and the current PR merge
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          from bagi_evidence_gate import BRANCH, GateError, Github, ci_snapshot
          api = Github(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"])
          endpoint = "branches/" + BRANCH.replace("/", "%2F")
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              sha = api.request(endpoint)["commit"]["sha"]
              snapshot = ci_snapshot(api, sha)
              if api.request(endpoint)["commit"]["sha"] != sha:
                  raise GateError("research HEAD changed during audit")
              if ci_snapshot(api, sha) != snapshot:
                  raise GateError("CI or PR provenance changed during audit")
          except (GateError, KeyError, TypeError, ValueError) as exc:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(f"CI audit HOLD: {exc}\n")
                  output.write("Research waits for verified CI; no work was admitted.\n")
              raise SystemExit(2) from exc
          with open(summary, "a", encoding="utf-8") as output:
              output.write("CI provenance verified: " + json.dumps(snapshot) + "\n")
              output.write("CI verified. Research may proceed; "
                           "this does not establish scientific progress.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("research_sha=" + sha + "\n")
          PYTHON

  research:
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    env:
      BAGI_RESEARCH_STUDY: ${{ needs.audit.outputs.study }}
      BAGI_RESEARCH_SOURCE_SHA: ${{ needs.audit.outputs.research_sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.audit.outputs.research_sha }}
          persist-credentials: false

      - name: Recheck exact source and CI before compute
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.audit.outputs.research_sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from bagi_evidence_gate import BRANCH, GateError, Github, ci_snapshot
          api = Github(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"])
          sha = api.request("branches/" + BRANCH.replace("/", "%2F"))["commit"]["sha"]
          if sha != os.environ["EXPECTED_SHA"]:
              raise GateError("research branch changed after admission")
          ci_snapshot(api, sha)
          PYTHON

      - name: Identify branch revision and UTC research date
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Reuse any successful evaluation of this exact revision
        if: github.event_name != 'push' && inputs.force_retrain != true
        id: evaluated
        uses: actions/cache/restore@v4
        with:
          path: .bagi-evaluated
          key: bagi-evaluated-${{ steps.revision.outputs.sha }}-${{ env.BAGI_RESEARCH_STUDY }}

      - name: Note cached evaluation
        if: steps.evaluated.outputs.cache-hit == 'true'
        run: echo "This revision was already evaluated; reusing results instead of repeating compute." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.evaluated.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install BAGI (legacy study)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI cross-objective BC study (M18)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm18'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI matched extra-label replay study (M17)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm17'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI sequential public behavior cloning (M16)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm16'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI native public action cloning (M15)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm15'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI public open-door replication (M14)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm14'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI native physical coverage study (M13)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm13'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI for public front-cell calibration (M12)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm12'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI with maintained public-effect GRU (M11)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm11'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI with pinned existing RL implementations (M1)
        if: steps.evaluated.outputs.cache-hit != 'true' && (env.BAGI_RESEARCH_STUDY == 'm1' || env.BAGI_RESEARCH_STUDY == 'm2' || env.BAGI_RESEARCH_STUDY == 'm3' || env.BAGI_RESEARCH_STUDY == 'm4' || env.BAGI_RESEARCH_STUDY == 'm5' || env.BAGI_RESEARCH_STUDY == 'm6' || env.BAGI_RESEARCH_STUDY == 'm7' || env.BAGI_RESEARCH_STUDY == 'm8' || env.BAGI_RESEARCH_STUDY == 'm9' || env.BAGI_RESEARCH_STUDY == 'm10' || env.BAGI_RESEARCH_STUDY == 'm10p1')
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,rl]'

      - name: Verify research platform
        if: steps.evaluated.outputs.cache-hit != 'true'
        run: make check

      - name: Run admitted M1 public-observation goal-learning trial
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm1'
        run: |
          python -m bagi.experiments.m1_goal_learning --config configs/m1_goal_learning.yaml --execute

      - name: Run admitted M2 extended goal-learning and sampling diagnostic
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm2'
        run: |
          python -m bagi.experiments.m1_goal_learning --config configs/m2_goal_learning.yaml --output runs/m2_goal_learning/summary.json --execute

      - name: Run admitted M3 independent goal-memory replication
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm3'
        run: |
          python -m bagi.experiments.m1_goal_learning --config configs/m3_goal_learning.yaml --output runs/m3_goal_learning/summary.json --execute

      - name: Retrieve verified M3 numeric checkpoint artifact for M4
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/m4_frozen_policy/input
          gh api 'repos/'"$GITHUB_REPOSITORY"'/actions/artifacts/13823291153/zip' > runs/m4_frozen_policy/input/m3-artifact.zip
          echo '4aa0656b6dd6d9aacd8a187246014100cb71368f194e5c21682182618d860739  runs/m4_frozen_policy/input/m3-artifact.zip' | sha256sum -c -
          unzip -q runs/m4_frozen_policy/input/m3-artifact.zip -d runs/m4_frozen_policy/input

      - name: Run admitted M4 evaluation-only frozen policy diagnostic
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm4'
        run: |
          python -m bagi.experiments.m4_frozen_policy_eval --config configs/m4_frozen_policy.yaml --artifact-root runs/m4_frozen_policy/input --output runs/m4_frozen_policy/summary.json --execute

      - name: Run admitted M5 continual task-retention PPO study
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm5'
        run: |
          python -m bagi.experiments.m5_continual_retention --config configs/m5_continual_retention.yaml --output runs/m5_continual_retention/summary.json --execute

      - name: Run admitted M6 DoorKey episode-continuity ablation
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm6'
        run: |
          python -m bagi.experiments.m6_doorkey_continuity --config configs/m6_doorkey_continuity.yaml --output runs/m6_doorkey_continuity/summary.json --execute

      - name: Retrieve verified M6 numeric checkpoint artifact for M7
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs/m7_frozen_doorkey_sampling/input
          gh api 'repos/'"$GITHUB_REPOSITORY"'/actions/artifacts/13838577607/zip' > runs/m7_frozen_doorkey_sampling/input/m6-artifact.zip
          echo '10f425ac3fc2420a4ba970180c3947eeffab28414cad9353ebdc2558042a661b  runs/m7_frozen_doorkey_sampling/input/m6-artifact.zip' | sha256sum -c -
          unzip -q runs/m7_frozen_doorkey_sampling/input/m6-artifact.zip -d runs/m7_frozen_doorkey_sampling/input

      - name: Run admitted M7 frozen DoorKey native-action sampling diagnostic
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm7'
        run: |
          python -m bagi.experiments.m7_frozen_doorkey_sampling --config configs/m7_frozen_doorkey_sampling.yaml --artifact-root runs/m7_frozen_doorkey_sampling/input --output runs/m7_frozen_doorkey_sampling/summary.json --execute

      - name: Run admitted M8 fresh DoorKey PPO entropy ablation
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm8'
        run: |
          python -m bagi.experiments.m8_doorkey_entropy --config configs/m8_doorkey_entropy.yaml --output runs/m8_doorkey_entropy/summary.json --execute

      - name: Run admitted M9 fresh DoorKey recurrent PPO comparison
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm9'
        run: |
          python -m bagi.experiments.m9_recurrent_doorkey --config configs/m9_recurrent_doorkey.yaml --output runs/m9_recurrent_doorkey/summary.json --execute

      - name: Run admitted M10 fresh train-only physical-action diagnostic
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm10'
        run: |
          python -m bagi.experiments.m10_train_only_diagnostic --config configs/m10_train_only_diagnostic.yaml --output runs/m10_train_only_diagnostic/summary.json --execute

      - name: Run admitted M10-P1 fresh public representation PPO comparison
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm10p1'
        run: |
          python -m bagi.experiments.m10_public_representation --config configs/m10_public_representation.yaml --output runs/m10_public_representation/summary.json --execute

      - name: Run admitted M11 fresh public-effect retention study
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm11'
        run: |
          python -m bagi.experiments.m11_public_effect_retention --config configs/m11_public_effect_retention.yaml --output runs/m11_public_effect_retention/summary.json --execute

      - name: Run admitted M12 public native forward-effect prediction
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm12'
        run: |
          python -m bagi.experiments.m12_public_front_effect --config configs/m12_public_front_effect.yaml --output runs/m12_public_front_effect/summary.json --execute

      - name: Run admitted M13 public-only native physical-interaction coverage
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm13'
        run: |
          python -m bagi.experiments.m13_public_interaction_coverage --config configs/m13_public_interaction_coverage.yaml --output runs/m13_public_interaction_coverage/summary.json --execute

      - name: Run admitted M14 public native open-door goal replication
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm14'
        run: |
          python -m bagi.experiments.m14_public_open_door --config configs/m14_public_open_door.yaml --output runs/m14_public_open_door/summary.json --execute

      - name: Run admitted M15 learned public-action behavior cloning
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm15'
        run: |
          python -m bagi.experiments.m15_public_action_bc --config configs/m15_public_bc.yaml --output runs/m15_public_action_bc/summary.json --execute

      - name: Run admitted M16 sequential physical public BC retention
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm16'
        run: |
          python -m bagi.experiments.m16_sequential_public_bc --config configs/m16_sequential_public_bc.yaml --output runs/m16_sequential_public_bc/summary.json --execute

      - name: Run admitted M18 cross-objective physical BC transfer
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm18'
        run: |
          python -m bagi.experiments.m18_matched_replay --config configs/m18_matched_replay.yaml --output runs/m18_matched_replay/summary.json --execute

      - name: Run admitted M17 matched source versus target replay study
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm17'
        run: |
          python -m bagi.experiments.m17_matched_replay --config configs/m17_matched_replay.yaml --output runs/m17_matched_replay/summary.json --execute

      - name: Restore causal-v2 checkpoint cache
        if: inputs.force_retrain != true && steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        id: causal-cache
        uses: actions/cache@v4
        with:
          path: runs/sample_efficiency_causal_v2
          key: bagi-causal-v2-${{ hashFiles('configs/sample_efficiency_causal_v2.yaml', 'bagi/models/world_model.py', 'bagi/experiments/train_world_model.py', 'bagi/experiments/collect_guided.py', 'bagi/worlds/workshop.py') }}

      - name: Build causal-v2 checkpoint on cache miss
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy' && steps.causal-cache.outputs.cache-hit != 'true'
        run: make sample-efficiency-causal-v2

      - name: Run oracle search ceiling
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: make oracle-search-ceiling

      - name: Run learned planner candidate sweep
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: make causal-candidate-sweep

      - name: Run grounded imagination-gap diagnostic
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: python -m bagi.experiments.imagination_gap --config configs/imagination_gap.yaml

      - name: Capture research metadata
        if: always() && steps.evaluated.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/research-loop
          git rev-parse HEAD > artifacts/research-loop/research_branch_commit.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > artifacts/research-loop/run_utc.txt
          printf '%s\n' "$BAGI_RESEARCH_STUDY" > artifacts/research-loop/study_mode.txt
          for path in \
            runs/sample_efficiency_causal_v2/summary.json \
            runs/sample_efficiency_causal_v2/summary.csv \
            runs/oracle_search_ceiling/summary.json \
            runs/causal_candidate_sweep/summary.json \
            runs/imagination_gap/summary.json \
            runs/m1_goal_learning/summary.json \
            runs/m2_goal_learning/summary.json \
            runs/m3_goal_learning/summary.json \
            runs/m4_frozen_policy/summary.json \
            runs/m5_continual_retention/summary.json \
            runs/m6_doorkey_continuity/summary.json \
            runs/m7_frozen_doorkey_sampling/summary.json \
            runs/m8_doorkey_entropy/summary.json \
            runs/m9_recurrent_doorkey/summary.json \
            runs/m10_train_only_diagnostic/summary.json \
            runs/m10_public_representation/summary.json \
            runs/m11_public_effect_retention/summary.json \
            runs/m12_public_front_effect/summary.json \
            runs/m13_public_interaction_coverage/summary.json \
            runs/m14_public_open_door/summary.json \
            runs/m15_public_action_bc/summary.json \
            runs/m16_sequential_public_bc/summary.json \
            runs/m17_matched_replay/summary.json \
            runs/m18_matched_replay/summary.json; do
            if [ -f "$path" ]; then
              cp "$path" "artifacts/research-loop/$(basename "$(dirname "$path")")-$(basename "$path")"
            fi
          done

      - name: Upload research results
        if: always() && steps.evaluated.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bagi-research-${{ github.run_number }}
          path: |
            artifacts/research-loop
            runs/m1_goal_learning/*.npz
            runs/m1_goal_learning/progress.json
            runs/m2_goal_learning/*.npz
            runs/m2_goal_learning/progress.json
            runs/m3_goal_learning/*.npz
            runs/m3_goal_learning/progress.json
            runs/m4_frozen_policy/progress.json
            runs/m5_continual_retention/progress.json
            runs/m5_continual_retention/*.npz
            runs/m6_doorkey_continuity/progress.json
            runs/m6_doorkey_continuity/*.npz
            runs/m7_frozen_doorkey_sampling/progress.json
            runs/m8_doorkey_entropy/progress.json
            runs/m8_doorkey_entropy/*.npz
            runs/m9_recurrent_doorkey/progress.json
            runs/m9_recurrent_doorkey/*.npz
            runs/m10_train_only_diagnostic/progress.json
            runs/m10_train_only_diagnostic/*.npz
            runs/m10_public_representation/progress.json
            runs/m10_public_representation/*.npz
            runs/m11_public_effect_retention/progress.json
            runs/m11_public_effect_retention/*.npz
            runs/m12_public_front_effect/progress.json
            runs/m12_public_front_effect/*.npz
            runs/m13_public_interaction_coverage/progress.json
            runs/m14_public_open_door/progress.json
            runs/m15_public_action_bc/progress.json
            runs/m15_public_action_bc/*.npz
            runs/m16_sequential_public_bc/progress.json
            runs/m16_sequential_public_bc/*.npz
            runs/m17_matched_replay/progress.json
            runs/m17_matched_replay/*.npz
            runs/m18_matched_replay/progress.json
            runs/m18_matched_replay/*.npz
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve newly produced checkpoints outside source history
        if: always() && steps.evaluated.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bagi-checkpoints-${{ github.run_id }}
          path: runs/sample_efficiency_causal_v2/**/world_model/world_model.pt
          if-no-files-found: warn
          retention-days: 30

      - name: Save successful revision evaluation marker
        if: steps.evaluated.outputs.cache-hit != 'true'
        run: |
          mkdir -p .bagi-evaluated
          printf 'Evaluated %s on %s\n' "${{ steps.revision.outputs.sha }}" "${{ steps.revision.outputs.day }}" > .bagi-evaluated/marker.txt

      - uses: actions/cache/save@v4
        if: steps.evaluated.outputs.cache-hit != 'true'
        with:
          path: .bagi-evaluated
          key: bagi-evaluated-${{ steps.revision.outputs.sha }}-${{ env.BAGI_RESEARCH_STUDY }}
