name: BAGI Research Loop

# Scheduled research is admitted only after exact CI provenance and orderly branch checks.
on:
  workflow_dispatch:
    inputs:
      force_retrain:
        description: Train afresh instead of reusing evaluation/checkpoint caches
        type: boolean
        default: false
      study:
        description: "Research study to execute"
        type: choice
        required: true
        default: legacy
        options:
          - legacy
          - m1
          - m2
  schedule:
    - cron: "17 * * * *"
  # Branch-only, explicitly requested one-shot fresh M1 fit; no duplicate workflow.
  push:
    branches: [setup/initial-platform]
    paths:
      - .github/bagi-m1-once.json
      - .github/bagi-m2-once.json

permissions:
  contents: read

concurrency:
  group: bagi-research-loop
  cancel-in-progress: false

jobs:
  audit:
    outputs:
      research_sha: ${{ steps.verify.outputs.research_sha }}
      study: ${{ steps.mode.outputs.study }}
    name: Verify current source and PR merge CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fail closed on missing or unknown manual study
        id: mode
        env:
          BAGI_DISPATCH_STUDY: ${{ inputs.study }}
        run: python3 scripts/bagi_research_dispatch.py

      - name: Await new exact-HEAD CI for one-shot push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.sha }}
        run: python3 scripts/bagi_wait_for_research_ci.py

      - name: Check both CI events and the current PR merge
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          from bagi_evidence_gate import BRANCH, GateError, Github, ci_snapshot
          api = Github(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"])
          endpoint = "branches/" + BRANCH.replace("/", "%2F")
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              sha = api.request(endpoint)["commit"]["sha"]
              snapshot = ci_snapshot(api, sha)
              if api.request(endpoint)["commit"]["sha"] != sha:
                  raise GateError("research HEAD changed during audit")
              if ci_snapshot(api, sha) != snapshot:
                  raise GateError("CI or PR provenance changed during audit")
          except (GateError, KeyError, TypeError, ValueError) as exc:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(f"CI audit HOLD: {exc}\n")
                  output.write("Research waits for verified CI; no work was admitted.\n")
              raise SystemExit(2) from exc
          with open(summary, "a", encoding="utf-8") as output:
              output.write("CI provenance verified: " + json.dumps(snapshot) + "\n")
              output.write("CI verified. Research may proceed; "
                           "this does not establish scientific progress.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("research_sha=" + sha + "\n")
          PYTHON

  research:
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    env:
      BAGI_RESEARCH_STUDY: ${{ needs.audit.outputs.study }}
      BAGI_RESEARCH_SOURCE_SHA: ${{ needs.audit.outputs.research_sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.audit.outputs.research_sha }}
          persist-credentials: false

      - name: Recheck exact source and CI before compute
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.audit.outputs.research_sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import sys
          sys.path.insert(0, "scripts")
          from bagi_evidence_gate import BRANCH, GateError, Github, ci_snapshot
          api = Github(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"])
          sha = api.request("branches/" + BRANCH.replace("/", "%2F"))["commit"]["sha"]
          if sha != os.environ["EXPECTED_SHA"]:
              raise GateError("research branch changed after admission")
          ci_snapshot(api, sha)
          PYTHON

      - name: Identify branch revision and UTC research date
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Reuse any successful evaluation of this exact revision
        if: github.event_name != 'push' && inputs.force_retrain != true
        id: evaluated
        uses: actions/cache/restore@v4
        with:
          path: .bagi-evaluated
          key: bagi-evaluated-${{ steps.revision.outputs.sha }}-${{ env.BAGI_RESEARCH_STUDY }}

      - name: Note cached evaluation
        if: steps.evaluated.outputs.cache-hit == 'true'
        run: echo "This revision was already evaluated; reusing results instead of repeating compute." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.evaluated.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install BAGI (legacy study)
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install BAGI with pinned existing RL implementations (M1)
        if: steps.evaluated.outputs.cache-hit != 'true' && (env.BAGI_RESEARCH_STUDY == 'm1' || env.BAGI_RESEARCH_STUDY == 'm2')
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,rl]'

      - name: Verify research platform
        if: steps.evaluated.outputs.cache-hit != 'true'
        run: make check

      - name: Run admitted M1 public-observation goal-learning trial
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm1'
        run: |
          python -m bagi.experiments.m1_goal_learning --config configs/m1_goal_learning.yaml --execute

      - name: Run admitted M2 extended goal-learning and sampling diagnostic
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'm2'
        run: |
          python -m bagi.experiments.m1_goal_learning --config configs/m2_goal_learning.yaml --output runs/m2_goal_learning/summary.json --execute

      - name: Restore causal-v2 checkpoint cache
        if: inputs.force_retrain != true && steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        id: causal-cache
        uses: actions/cache@v4
        with:
          path: runs/sample_efficiency_causal_v2
          key: bagi-causal-v2-${{ hashFiles('configs/sample_efficiency_causal_v2.yaml', 'bagi/models/world_model.py', 'bagi/experiments/train_world_model.py', 'bagi/experiments/collect_guided.py', 'bagi/worlds/workshop.py') }}

      - name: Build causal-v2 checkpoint on cache miss
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy' && steps.causal-cache.outputs.cache-hit != 'true'
        run: make sample-efficiency-causal-v2

      - name: Run oracle search ceiling
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: make oracle-search-ceiling

      - name: Run learned planner candidate sweep
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: make causal-candidate-sweep

      - name: Run grounded imagination-gap diagnostic
        if: steps.evaluated.outputs.cache-hit != 'true' && env.BAGI_RESEARCH_STUDY == 'legacy'
        run: python -m bagi.experiments.imagination_gap --config configs/imagination_gap.yaml

      - name: Capture research metadata
        if: always() && steps.evaluated.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/research-loop
          git rev-parse HEAD > artifacts/research-loop/research_branch_commit.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > artifacts/research-loop/run_utc.txt
          printf '%s\n' "$BAGI_RESEARCH_STUDY" > artifacts/research-loop/study_mode.txt
          for path in \
            runs/sample_efficiency_causal_v2/summary.json \
            runs/sample_efficiency_causal_v2/summary.csv \
            runs/oracle_search_ceiling/summary.json \
            runs/causal_candidate_sweep/summary.json \
            runs/imagination_gap/summary.json \
            runs/m1_goal_learning/summary.json \
            runs/m2_goal_learning/summary.json; do
            if [ -f "$path" ]; then
              cp "$path" "artifacts/research-loop/$(basename "$(dirname "$path")")-$(basename "$path")"
            fi
          done

      - name: Upload research results
        if: always() && steps.evaluated.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bagi-research-${{ github.run_number }}
          path: |
            artifacts/research-loop
            runs/m1_goal_learning/*.npz
            runs/m1_goal_learning/progress.json
            runs/m2_goal_learning/*.npz
            runs/m2_goal_learning/progress.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve newly produced checkpoints outside source history
        if: always() && steps.evaluated.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bagi-checkpoints-${{ github.run_id }}
          path: runs/sample_efficiency_causal_v2/**/world_model/world_model.pt
          if-no-files-found: warn
          retention-days: 30

      - name: Save successful revision evaluation marker
        if: steps.evaluated.outputs.cache-hit != 'true'
        run: |
          mkdir -p .bagi-evaluated
          printf 'Evaluated %s on %s\n' "${{ steps.revision.outputs.sha }}" "${{ steps.revision.outputs.day }}" > .bagi-evaluated/marker.txt

      - uses: actions/cache/save@v4
        if: steps.evaluated.outputs.cache-hit != 'true'
        with:
          path: .bagi-evaluated
          key: bagi-evaluated-${{ steps.revision.outputs.sha }}-${{ env.BAGI_RESEARCH_STUDY }}
