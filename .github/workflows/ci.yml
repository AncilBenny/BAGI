name: CI

on:
  push:
    branches: [main, "setup/**", "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Install pinned maintained RL controls
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && (contains(github.event.head_commit.message, '[gate-a-competence]') || contains(github.event.head_commit.message, '[gate-a-navigation]') || contains(github.event.head_commit.message, '[gate-a-policy-audit]') || contains(github.event.head_commit.message, '[gate-a-observation-probe]') || contains(github.event.head_commit.message, '[gate-a-categorical]'))
        run: pip install -e '.[rl]'
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: One-off Gate A native feasibility pilot
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-pilot]')
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m bagi.experiments.cumulative_transfer --output "$RUNNER_TEMP/gate-a-pilot" > "$RUNNER_TEMP/gate-a-pilot-console.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gate-a-pilot" / "summary.json"
          s = json.loads(p.read_text())
          assert s["source"]["commit"] == os.environ["GITHUB_SHA"]
          assert s["source"]["tracked_worktree_dirty"] is False
          assert s["scientific_pass"] is False
          print({k: s[k] for k in ("actual_exposure_actions", "actual_training_actions",
                                  "actual_evaluation_actions", "actual_optimizer_updates",
                                  "actual_replay_presentations", "seconds")})
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-pilot]')
        with:
          name: bagi-gate-a-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-a-pilot
          if-no-files-found: error
      - name: One-off Gate A native competence diagnostic
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-competence]')
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m bagi.experiments.gate_a_competence --output "$RUNNER_TEMP/gate-a-competence" > "$RUNNER_TEMP/gate-a-competence-console.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gate-a-competence/summary.json").read_text())
          assert s["source"]["commit"] == os.environ["GITHUB_SHA"]
          assert s["source"]["tracked_worktree_dirty"] is False
          assert s["scientific_pass"] is False
          assert s["actual_training_actions"] == 393216
          print({k: s[k] for k in ("actual_training_actions", "actual_evaluation_actions",
                                  "actual_optimizer_updates", "actual_sample_presentations", "seconds")})
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-competence]')
        with:
          name: bagi-gate-a-competence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-a-competence
          if-no-files-found: error
      - name: One-off Gate A navigation acquisition
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-navigation]')
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import os
          from pathlib import Path
          from bagi.experiments.gate_a_competence import TASKS, run
          target = Path(os.environ["RUNNER_TEMP"]) / "gate-a-navigation"
          s = run(target, domain=TASKS[0], budget=65536, arms=("recurrent_ppo",))
          assert s["source"]["commit"] == os.environ["GITHUB_SHA"]
          assert s["source"]["tracked_worktree_dirty"] is False
          assert s["scientific_pass"] is False
          assert s["actual_training_actions"] == 196608
          assert s["actual_optimizer_updates"] == 12288
          assert s["actual_sample_presentations"] == 786432
          print({k: s[k] for k in ("actual_training_actions", "actual_evaluation_actions",
                                  "actual_optimizer_updates", "actual_sample_presentations", "seconds")})
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-navigation]')
        with:
          name: bagi-gate-a-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-a-navigation
          if-no-files-found: error
      - name: One-off Gate A navigation policy audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-policy-audit]')
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import os
          from pathlib import Path
          from bagi.experiments.gate_a_navigation_policy import run
          s = run(Path(os.environ["RUNNER_TEMP"]) / "gate-a-policy-audit")
          assert s["source"]["commit"] == os.environ["GITHUB_SHA"]
          assert s["source"]["tracked_worktree_dirty"] is False
          assert s["scientific_pass"] is False
          assert s["actual_training_actions"] == 196608
          assert s["actual_optimizer_updates"] == 12288
          assert s["actual_sample_presentations"] == 786432
          print({k: s[k] for k in ("actual_training_actions", "actual_evaluation_actions",
                                  "actual_optimizer_updates", "actual_sample_presentations", "seconds")})
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-policy-audit]')
        with:
          name: bagi-gate-a-policy-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-a-policy-audit
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-observation-probe]')
        with:
          name: bagi-gate-a-policy-audit-45940638160-1
          run-id: 45940638160
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate-a-frozen-input
      - name: Gate A frozen observation dependence
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-observation-probe]')
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m bagi.experiments.gate_a_observation_dependence \
            --inputs "$RUNNER_TEMP/gate-a-frozen-input" \
            --output "$RUNNER_TEMP/gate-a-observation-probe"
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gate-a-observation-probe/summary.json").read_text())
          assert s["source"]["commit"] == os.environ["GITHUB_SHA"]
          assert s["source"]["tracked_worktree_dirty"] is False
          assert s["scientific_pass"] is False
          assert s["actual_training_actions"] == s["actual_optimizer_updates"] == 0
          print("actual_evaluation_actions", s["actual_evaluation_actions"])
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-observation-probe]')
        with:
          name: bagi-gate-a-observation-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-a-observation-probe
          if-no-files-found: error
      - name: Gate A matched categorical observation diagnostic
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-categorical]')
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import os
          from pathlib import Path
          from bagi.experiments.gate_a_representation import run
          s = run(Path(os.environ["RUNNER_TEMP"]) / "gate-a-categorical")
          assert s["source"]["commit"] == os.environ["GITHUB_SHA"]
          assert s["source"]["tracked_worktree_dirty"] is False
          assert s["scientific_pass"] is False
          assert s["actual_training_actions"] == 393216
          assert s["actual_optimizer_updates"] == 24576
          assert s["actual_sample_presentations"] == 1572864
          print({k: s[k] for k in ("actual_training_actions", "actual_evaluation_actions",
                                  "actual_optimizer_updates", "actual_sample_presentations", "seconds")})
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/setup/cumulative-transfer-a' && contains(github.event.head_commit.message, '[gate-a-categorical]')
        with:
          name: bagi-gate-a-categorical-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-a-categorical
          if-no-files-found: error
      - name: Record tested PR merge provenance
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          merge = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = [pr["base"]["sha"], pr["head"]["sha"]]
          # Read the checked-out commit object; shallow checkout still contains its parents.
          commit = subprocess.check_output(["git", "cat-file", "-p", "HEAD"], text=True)
          parents = [line.split()[1] for line in commit.split("\n\n", 1)[0].splitlines()
                     if line.startswith("parent ")]
          if merge != os.environ["GITHUB_SHA"] or parents != expected:
              raise SystemExit("HOLD: checkout is not the event's exact PR merge")
          data = {"repository": os.environ["GITHUB_REPOSITORY"], "event": "pull_request",
                  "pr_number": event["number"], "source_sha": expected[1],
                  "base_sha": expected[0], "merge_sha": merge,
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"])}
          target = Path(os.environ["RUNNER_TEMP"]) / "ci-provenance"
          target.mkdir(exist_ok=True)
          (target / "ci_provenance.json").write_text(json.dumps(data))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: bagi-ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-provenance/ci_provenance.json
          if-no-files-found: error
          retention-days: 30
