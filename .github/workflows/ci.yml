name: CI

on:
  push:
    branches: [main, "setup/**", "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Record tested PR merge provenance
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          merge = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = [pr["base"]["sha"], pr["head"]["sha"]]
          # Read the checked-out commit object; shallow checkout still contains its parents.
          commit = subprocess.check_output(["git", "cat-file", "-p", "HEAD"], text=True)
          parents = [line.split()[1] for line in commit.split("\n\n", 1)[0].splitlines()
                     if line.startswith("parent ")]
          if merge != os.environ["GITHUB_SHA"] or parents != expected:
              raise SystemExit("HOLD: checkout is not the event's exact PR merge")
          data = {"repository": os.environ["GITHUB_REPOSITORY"], "event": "pull_request",
                  "pr_number": event["number"], "source_sha": expected[1],
                  "base_sha": expected[0], "merge_sha": merge,
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"])}
          target = Path(os.environ["RUNNER_TEMP"]) / "ci-provenance"
          target.mkdir(exist_ok=True)
          (target / "ci_provenance.json").write_text(json.dumps(data))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: bagi-ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-provenance/ci_provenance.json
          if-no-files-found: error
          retention-days: 30
