name: BAGI Real Wrong-Object Recovery Probe

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_wrong_object_recovery.py"
      - "tests/test_xland_wrong_object_recovery.py"
      - "configs/xland_wrong_object_recovery.yaml"
      - ".github/workflows/bagi-wrong-object-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reuse original verified numeric labels and prior BC results
        run: |
          mkdir -p runs/reuse19_recovery_data runs/reuse23_recovery_anchor
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/reuse19_recovery_data
          gh run download 39644180240 --repo AncilBenny/BAGI --name bagi-instruction-actual-history-control --dir runs/reuse23_recovery_anchor
          test -f runs/reuse19_recovery_data/action_provenance_seed29.npz
          test -f runs/reuse23_recovery_anchor/summary.json
      - name: Install published learner and upstream XLand
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "xminigrid==0.9.3" "imitation==1.0.1" "pyyaml>=6" "pytest>=8" "ruff>=0.6"
      - name: Guard exact frozen failure and absence of private policy state
        run: |
          ruff check bagi/experiments/xland_wrong_object_recovery.py tests/test_xland_wrong_object_recovery.py
          python -m pytest -q tests/test_xland_wrong_object_recovery.py
      - name: Probe existing teacher recovery on real learner error
        run: python -m bagi.experiments.xland_wrong_object_recovery --config configs/xland_wrong_object_recovery.yaml
      - name: Archive actual native-actions and corrective-label feasibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-real-wrong-object-recovery
          path: |
            runs/xland_wrong_object_recovery/summary.json
            runs/xland_wrong_object_recovery/reuse30_summary.json
          if-no-files-found: warn
          retention-days: 30
