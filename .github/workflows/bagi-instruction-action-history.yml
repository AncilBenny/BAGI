name: BAGI Instruction and Executed History Control

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_instruction_action_history.py"
      - "tests/test_xland_instruction_action_history.py"
      - "configs/xland_instruction_action_history.yaml"
      - ".github/workflows/bagi-instruction-action-history.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  history-with-instructions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified REUSE-19 numeric executed history
        run: |
          mkdir -p runs/reuse19_action_history_source
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/reuse19_action_history_source
          test -f runs/reuse19_action_history_source/action_provenance_seed17.npz
          test -f runs/reuse19_action_history_source/action_provenance_seed29.npz
      - name: Install pinned upstream BC and XLand
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "xminigrid==0.9.3" "imitation==1.0.1" "pyyaml>=6" "pytest>=8" "ruff>=0.6"
      - name: Lint and verify action-history causality
        run: |
          ruff check bagi/experiments/xland_instruction_action_history.py tests/test_xland_instruction_action_history.py
          python -m pytest -q tests/test_xland_instruction_action_history.py
      - name: Evaluate instruction-conditioned real history versus sham control
        run: python -m bagi.experiments.xland_instruction_action_history --config configs/xland_instruction_action_history.yaml
      - name: Archive bounded independent source-skill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-instruction-actual-history-control
          path: runs/xland_instruction_action_history/summary.json
          if-no-files-found: warn
          retention-days: 30
