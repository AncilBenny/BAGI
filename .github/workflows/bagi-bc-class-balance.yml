name: BAGI Existing BC Class Balance Test

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_bc_class_balance.py"
      - "tests/test_xland_bc_class_balance.py"
      - "configs/xland_bc_class_balance.yaml"
      - ".github/workflows/bagi-bc-class-balance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-bc-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upstream packages with CPU-only torch
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "xminigrid==0.9.3" "imitation==1.0.1" "pyyaml>=6" "pytest>=8" "ruff>=0.6"
      - name: Check identical data pools and class sampling
        run: |
          ruff check bagi/experiments/xland_bc_class_balance.py tests/test_xland_bc_class_balance.py
          python -m pytest -q tests/test_xland_bc_class_balance.py
      - name: Compare original and class-balanced expert sampling
        run: python -m bagi.experiments.xland_bc_class_balance --config configs/xland_bc_class_balance.yaml
      - name: Save measured policy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-existing-bc-balanced
          path: runs/xland_bc_class_balance/summary.json
          if-no-files-found: warn
          retention-days: 30
