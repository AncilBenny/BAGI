name: BAGI Upstream Instruction BC Control

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_upstream_instruction_bc.py"
      - "tests/test_xland_upstream_instruction_bc.py"
      - "configs/xland_upstream_instruction_bc.yaml"
      - ".github/workflows/bagi-upstream-instruction-bc.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  instruction-control:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download original verified numeric expert labels
        run: |
          mkdir -p runs/reuse19_instruction_source
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/reuse19_instruction_source
          test -f runs/reuse19_instruction_source/action_provenance_seed17.npz
          test -f runs/reuse19_instruction_source/action_provenance_seed29.npz
      - name: Install pinned upstream XLand and BC
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "xminigrid==0.9.3" "imitation==1.0.1" "pyyaml>=6" "pytest>=8" "ruff>=0.6"
      - name: Verify public task instruction interface and lint
        run: |
          ruff check bagi/experiments/xland_upstream_instruction_bc.py tests/test_xland_upstream_instruction_bc.py
          python -m pytest -q tests/test_xland_upstream_instruction_bc.py
      - name: Matched sham vs real instruction-conditioned source skill learning
        run: python -m bagi.experiments.xland_upstream_instruction_bc --config configs/xland_upstream_instruction_bc.yaml
      - name: Preserve reward and original-label fit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-upstream-instruction-bc
          path: runs/xland_upstream_instruction_bc/summary.json
          if-no-files-found: warn
          retention-days: 30
