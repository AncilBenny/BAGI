name: BAGI REUSE-35 Original Skill Rehearsal vs Full Physical Demos

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_complete_demo_rehearsal.py"
      - "tests/test_xland_complete_demo_rehearsal.py"
      - ".github/workflows/bagi-complete-demo-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rehearsal-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore verified original source and archived complete teacher data
        run: |
          mkdir -p runs/reuse35_source runs/reuse35_teacher
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/reuse35_source
          gh run download 40101923830 --repo AncilBenny/BAGI --name bagi-reuse33-complete-demo-bc --dir runs/reuse35_teacher
          test -f runs/reuse35_source/summary.json
          test -f runs/reuse35_source/action_provenance_seed17.npz
          test -f runs/reuse35_source/action_provenance_seed29.npz
          test -f runs/reuse35_teacher/summary.json
          test -f runs/reuse35_teacher/train_source_complete_demos.npz
      - name: Install unchanged published imitation BC/XLand CPU environment
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements/xland-reuse31.txt
          python -m pip check
      - name: Verify one preregistered rehearsal split and numerical contract
        run: |
          ruff check bagi/experiments/xland_complete_demo_rehearsal.py tests/test_xland_complete_demo_rehearsal.py
          python -m pytest -q tests/test_xland_complete_demo_rehearsal.py tests/test_xland_complete_demo_confirmation.py
      - name: Compare fixed rehearsal to original controls on untouched XLand
        run: |
          python -m bagi.experiments.xland_complete_demo_rehearsal --source-dir runs/reuse35_source --teacher-dir runs/reuse35_teacher --output-dir runs/reuse35_rehearsal
      - name: Archive genuine native evaluation even after negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-reuse35-fixed-rehearsal
          path: runs/reuse35_rehearsal/summary.json
          retention-days: 30
          if-no-files-found: warn
