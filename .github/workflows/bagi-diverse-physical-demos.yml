name: BAGI REUSE-36 Fixed Diverse Physical Demonstration Trial

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_diverse_physical_demos.py"
      - "tests/test_xland_diverse_physical_demos.py"
      - ".github/workflows/bagi-diverse-physical-demos.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diverse-physical-bc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore original SHA256-verified learner rows and original full teacher examples
        run: |
          mkdir -p runs/reuse36_source runs/reuse36_old_teacher
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/reuse36_source
          gh run download 40101923830 --repo AncilBenny/BAGI --name bagi-reuse33-complete-demo-bc --dir runs/reuse36_old_teacher
          test -f runs/reuse36_source/summary.json
          test -f runs/reuse36_source/action_provenance_seed17.npz
          test -f runs/reuse36_source/action_provenance_seed29.npz
          test -f runs/reuse36_old_teacher/summary.json
          test -f runs/reuse36_old_teacher/train_source_complete_demos.npz
      - name: Install unchanged published imitation BC and native XLand packages
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements/xland-reuse31.txt
          python -m pip check
      - name: Verify fixed TRAIN/TEST seed split and matched data budget
        run: |
          ruff check bagi/experiments/xland_diverse_physical_demos.py tests/test_xland_diverse_physical_demos.py
          python -m pytest -q tests/test_xland_diverse_physical_demos.py tests/test_xland_complete_demo_confirmation.py
      - name: Collect TRAIN complete physical stages then compare equal-exposure old/new diversity
        run: |
          python -m bagi.experiments.xland_diverse_physical_demos --source-dir runs/reuse36_source --old-teacher-dir runs/reuse36_old_teacher --output-dir runs/reuse36_diverse
      - name: Preserve real new teacher data and native model evaluation on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-reuse36-diverse-physical-training
          path: |
            runs/reuse36_diverse/summary.json
            runs/reuse36_diverse/diverse_train_physical.npz
          retention-days: 30
          if-no-files-found: warn
