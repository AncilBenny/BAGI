name: BAGI REUSE-31 Matched Native XLand Trial

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "requirements/xland-reuse31.txt"
      - "bagi/experiments/xland_gate_b_matched_learning.py"
      - ".github/workflows/bagi-reuse31-native-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matched-xland-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore verified TRAIN-only numerical source
        run: |
          mkdir -p runs/reuse31_source
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/reuse31_source
          test -f runs/reuse31_source/summary.json
          test -f runs/reuse31_source/action_provenance_seed17.npz
          test -f runs/reuse31_source/action_provenance_seed29.npz
      - name: Install published pinned CPU learning packages
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          # Separate REUSE-31 environment: base BAGI asks for Gymnasium>=1.0,
          # while established imitation==1.0.1 requires Gymnasium~=0.29.
          python -m pip install --no-cache-dir -r requirements/xland-reuse31.txt
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          for name in ('torch', 'xminigrid', 'imitation', 'gymnasium', 'jax', 'stable-baselines3'):
              print(f'{name}=={version(name)}')
          PY
      - name: Check original collector and matched-BC contracts
        run: |
          ruff check bagi/experiments/xland_gate_b_exact_collection.py bagi/experiments/xland_gate_b_native_collection.py bagi/experiments/xland_gate_b_matched_learning.py tests/test_xland_gate_b_exact_collection.py tests/test_xland_gate_b_native_collection.py tests/test_xland_gate_b_matched_learning.py
          python -m pytest -q tests/test_xland_gate_b_exact_collection.py tests/test_xland_gate_b_native_collection.py tests/test_xland_gate_b_matched_learning.py
      - name: Collect real TRAIN-only learner corrections and expert reset controls
        run: |
          python -m bagi.experiments.xland_gate_b_native_collection --source-dir runs/reuse31_source --output-dir runs/reuse31_native_collection
      - name: Require complete, matched 20 vs 20 teacher-label sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runs/reuse31_native_collection/summary.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for seed in data['results']:
              print('Seed', seed['model_seed'], 'matched', seed['matched'], 'arms', seed['arms'])
          if not data['comparison_complete']:
              raise SystemExit('REUSE-31 matched-label gate failed; no learner training')
          PY
      - name: Train matched established imitation BC and measure real BLUE placement
        run: |
          python -m bagi.experiments.xland_gate_b_matched_learning --source-dir runs/reuse31_source --collection-dir runs/reuse31_native_collection --output-dir runs/reuse31_matched_learning
      - name: Preserve native evidence, including failed collection attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-reuse31-real-xland-cpu
          path: |
            runs/reuse31_native_collection/summary.json
            runs/reuse31_native_collection/*.npz
            runs/reuse31_matched_learning/summary.json
          if-no-files-found: warn
          retention-days: 30
