name: BAGI G2-D1 Root Cause: Frozen Policy History and Pickup Opportunities

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_root_cause_d1.py"
      - "tests/test_xland_root_cause_d1.py"
      - ".github/workflows/bagi-root-cause-d1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-root-cause-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore frozen, verified TRAIN-only numeric source archives
        run: |
          mkdir -p runs/d1_source runs/d1_original_teacher runs/d1_diverse_teacher
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/d1_source
          gh run download 40101923830 --repo AncilBenny/BAGI --name bagi-reuse33-complete-demo-bc --dir runs/d1_original_teacher
          gh run download 40110945017 --repo AncilBenny/BAGI --name bagi-reuse36-diverse-physical-training --dir runs/d1_diverse_teacher
          test -f runs/d1_source/action_provenance_seed17.npz
          test -f runs/d1_source/action_provenance_seed29.npz
          test -f runs/d1_original_teacher/train_source_complete_demos.npz
          test -f runs/d1_diverse_teacher/diverse_train_physical.npz
      - name: Install approved CPU XLand and imitation learning dependencies
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements/xland-reuse31.txt
          python -m pip check
      - name: Validate causal-isolation and public-information contracts
        run: |
          ruff check bagi/experiments/xland_root_cause_d1.py tests/test_xland_root_cause_d1.py
          python -m pytest -q tests/test_xland_root_cause_d1.py
      - name: Execute frozen-policy ablation and discarded pickup probes on new layouts
        run: |
          python -m bagi.experiments.xland_root_cause_d1 \
            --source-dir runs/d1_source \
            --old-teacher-dir runs/d1_original_teacher \
            --diverse-dir runs/d1_diverse_teacher \
            --output-dir runs/g2_d1_root_cause
      - name: Archive diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-g2-d1-frozen-policy-root-cause
          path: runs/g2_d1_root_cause/summary.json
          retention-days: 30
          if-no-files-found: warn
