name: BAGI Gate C Matched Native PPO Memory Trial

# Bounded published PPO versus RecurrentPPO on real source-task XLand.
on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_gate_c_ppo_memory.py"
      - "tests/test_xland_gate_c_ppo_memory.py"
      - "configs/xland_gate_c_ppo_memory.yaml"
      - ".github/workflows/bagi-gate-c-ppo-memory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bagi-gate-c-native-ppo-memory
  cancel-in-progress: false

jobs:
  native-ppo-vs-recurrent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install previously verified native XLand and published PPO libraries
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements/xland-reuse31.txt "sb3-contrib==2.2.1"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          for package in ('torch', 'jax', 'xminigrid', 'gymnasium', 'stable-baselines3', 'sb3-contrib'):
              print(f'{package}=={version(package)}')
          PY
      - name: Verify the frozen native-interaction and information contract
        run: |
          ruff check bagi/experiments/xland_gate_c_ppo_memory.py tests/test_xland_gate_c_ppo_memory.py
          python -m pytest -q tests/test_xland_gate_c_ppo_memory.py
      - name: Compare published PPO and recurrent PPO with actual XLand actions
        run: |
          python -m bagi.experiments.xland_gate_c_ppo_memory --config configs/xland_gate_c_ppo_memory.yaml
      - name: Archive source-skill learner outcomes and physical object evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-gate-c-real-ppo-memory
          path: runs/xland_gate_c_ppo_memory/summary.json
          if-no-files-found: warn
          retention-days: 30
