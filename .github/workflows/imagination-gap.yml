name: BAGI E6 Imagination Gap

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/imagination_gap.py"
      - "tests/test_imagination_gap.py"
      - "configs/imagination_gap.yaml"
      - "bagi/planning/uncertainty_aware.py"
      - "bagi/experiments/planner_uncertainty_ablation.py"
      - "tests/test_uncertainty_planner.py"
      - "configs/planner_uncertainty_ablation.yaml"
      - "configs/planner_uncertainty_replication.yaml"
      - "bagi/experiments/dataset_foundations.py"
      - "tests/test_dataset_foundations.py"
      - "configs/dataset_foundations.yaml"
      - "bagi/experiments/reachable_state_holdout.py"
      - "tests/test_reachable_state_holdout.py"
      - "configs/reachable_state_holdout.yaml"
      - "bagi/experiments/coverage_collection.py"
      - "tests/test_coverage_collection.py"
      - "configs/coverage_collection.yaml"
      - "bagi/worlds/workshop.py"
      - "bagi/experiments/layout_transfer.py"
      - "tests/test_layout_transfer.py"
      - "configs/layout_transfer.yaml"
      - ".github/workflows/imagination-gap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bagi-imagination-gap
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          make check
      - name: Restore existing causal model
        uses: actions/cache/restore@v4
        with:
          path: runs/sample_efficiency_causal_v2
          key: bagi-causal-v2-e6-readonly
          restore-keys: |
            bagi-causal-v2-
      - name: Prepare checkpoint only if unavailable
        run: |
          if [ ! -f runs/sample_efficiency_causal_v2/guided_050/world_model/world_model.pt ]; then
            make sample-efficiency-causal-v2
          fi
      - name: Restore the training dataset if cache lacks transition logs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from bagi.experiments.collect_guided import run as collect
          original = yaml.safe_load(Path("configs/sample_efficiency_causal_v2.yaml").read_text())
          data = Path("runs/sample_efficiency_causal_v2/guided_050/data/transitions.jsonl")
          if data.exists():
              print("Auditing existing cached training transitions")
          else:
              print("Cache missing logs: deterministically reconstructing collection data, without training")
              coll = {
                  "seed": original["seed"],
                  "environment": original["environment"],
                  "collection": {
                      "guided_episodes": 50,
                      "random_episodes": original["sweep"]["random_episodes"],
                      "guided_seed_base": original["sweep"]["guided_seed_base"],
                      "random_seed_base": original["sweep"]["random_seed_base"],
                      "output_dir": str(data.parent),
                  },
              }
              config_path = Path("runs/dataset_foundations/reconstruction.yaml")
              config_path.parent.mkdir(parents=True, exist_ok=True)
              config_path.write_text(yaml.safe_dump(coll), encoding="utf-8")
              collect(str(config_path))
              Path("runs/dataset_foundations/reconstructed.txt").write_text(
                  "Collected identical policy and seeds, no new model training\n",
                  encoding="utf-8",
              )
          PY
      - name: Audit Gate A data diversity, leakage and hidden-state aliasing
        run: python -m bagi.experiments.dataset_foundations --config configs/dataset_foundations.yaml
      - name: Evaluate on all reachable state/action transitions (Gate A2)
        run: python -m bagi.experiments.reachable_state_holdout --config configs/reachable_state_holdout.yaml
      - name: Run fixed-budget visible-novelty coverage ablation (Gate A3)
        run: python -m bagi.experiments.coverage_collection --config configs/coverage_collection.yaml
      - name: Measure zero-shot mirrored layout transfer (Gate A6)
        run: python -m bagi.experiments.layout_transfer --config configs/layout_transfer.yaml
      - name: Run E6 imagination gap
        run: python -m bagi.experiments.imagination_gap --config configs/imagination_gap.yaml
      - name: Run E9 paired uncertainty ablation
        run: python -m bagi.experiments.planner_uncertainty_ablation --config configs/planner_uncertainty_ablation.yaml
      - name: Run E10 held-out uncertainty replication
        run: python -m bagi.experiments.planner_uncertainty_ablation --config configs/planner_uncertainty_replication.yaml
      - name: Upload E6, E9, E10 and foundation/transfer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-e6-e9-e10-layout-transfer
          path: |
            runs/imagination_gap/summary.json
            runs/planner_uncertainty_ablation/summary.json
            runs/planner_uncertainty_replication/summary.json
            runs/dataset_foundations/summary.json
            runs/reachable_state_holdout/summary.json
            runs/coverage_collection/summary.json
            runs/layout_transfer/summary.json
          if-no-files-found: warn
          retention-days: 30
