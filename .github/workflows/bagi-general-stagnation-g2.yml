name: "BAGI G2-D3: Frozen BC Public-Stagnation One-Step Recovery"

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/agents/public_stagnation.py"
      - "bagi/experiments/general_brain_stagnation_g2.py"
      - "tests/test_general_brain_stagnation_g2.py"
      - ".github/workflows/bagi-general-stagnation-g2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-stagnation-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
      OMP_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore frozen original physical TRAIN archives
        run: |
          mkdir -p runs/d3_source runs/d3_old_teacher runs/d3_diverse_teacher
          gh run download 39637067506 --repo AncilBenny/BAGI --name bagi-dagger-action-provenance --dir runs/d3_source
          gh run download 40101923830 --repo AncilBenny/BAGI --name bagi-reuse33-complete-demo-bc --dir runs/d3_old_teacher
          gh run download 40110945017 --repo AncilBenny/BAGI --name bagi-reuse36-diverse-physical-training --dir runs/d3_diverse_teacher
          test -f runs/d3_source/action_provenance_seed17.npz
          test -f runs/d3_source/action_provenance_seed29.npz
          test -f runs/d3_old_teacher/train_source_complete_demos.npz
          test -f runs/d3_diverse_teacher/diverse_train_physical.npz
      - name: Install isolated published pinned XLand CPU environment
        run: |
          python -m pip install --no-cache-dir "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements/xland-reuse31.txt
          python -m pip check
      - name: Verify native policy public-history and reward boundary
        run: |
          ruff check bagi/agents/public_stagnation.py bagi/experiments/general_brain_stagnation_g2.py tests/test_general_brain_stagnation_g2.py
          python -m pytest -q tests/test_public_stagnation.py tests/test_general_brain_stagnation_g2.py
      - name: Execute bounded 2-arm frozen-native study
        run: |
          python -m bagi.experiments.general_brain_stagnation_g2 \
            --source-dir runs/d3_source \
            --old-teacher-dir runs/d3_old_teacher \
            --diverse-dir runs/d3_diverse_teacher \
            --output-dir runs/g2_d3_public_stagnation
      - name: Archive real simulator results including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-g2-d3-public-stagnation
          path: runs/g2_d3_public_stagnation/summary.json
          retention-days: 30
          if-no-files-found: warn
