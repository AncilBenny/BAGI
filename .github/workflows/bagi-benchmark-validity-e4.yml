name: "BAGI G2-E4-P0: MiniGrid Benchmark Validity"

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/benchmark_validity_e4.py"
      - ".github/workflows/bagi-benchmark-validity-e4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bagi-benchmark-validity-e4
  cancel-in-progress: false

jobs:
  benchmark-validity-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only existing standard benchmark and test packages
        run: |
          python -m pip install --no-cache-dir "numpy>=1.26" "gymnasium>=1.0,<2" "minigrid==3.2.0" "pytest>=8" "ruff>=0.6"
          python -m pip check
      - name: Validate source contracts without ANY native simulator steps
        run: |
          ruff check bagi/experiments/benchmark_validity_e4.py tests/test_benchmark_validity_e4.py
          python -m pytest -q tests/test_benchmark_validity_e4.py
      - name: Execute ONE bounded benchmark-diversity audit; NO policy training
        run: |
          python -m bagi.experiments.benchmark_validity_e4 --output-dir runs/g2_e4_p0_benchmark_validity
      - name: Preserve numeric-safe JSON including partial audit on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-g2-e4-p0-benchmark-validity
          path: runs/g2_e4_p0_benchmark_validity/summary.json
          if-no-files-found: warn
          retention-days: 30
