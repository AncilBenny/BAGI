name: BAGI XLand Observation Aliasing Audit

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_observation_aliasing.py"
      - "bagi/experiments/xland_existing_bc.py"
      - "tests/test_xland_observation_aliasing.py"
      - "configs/xland_observation_aliasing.yaml"
      - ".github/workflows/bagi-xland-observation-aliasing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upstream XLand and lightweight test tools
        run: |
          python -m pip install --no-cache-dir "xminigrid==0.9.3" "pyyaml>=6" "pytest>=8" "ruff>=0.6"
      - name: Lint and unit tests
        run: |
          ruff check bagi/experiments/xland_observation_aliasing.py bagi/experiments/xland_existing_bc.py tests/test_xland_observation_aliasing.py
          python -m pytest -q tests/test_xland_observation_aliasing.py tests/test_xland_existing_bc.py
      - name: Audit original three-skill expert data without training
        run: python -m bagi.experiments.xland_observation_aliasing --config configs/xland_observation_aliasing.yaml
      - name: Preserve raw diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-xland-observation-aliasing
          path: runs/xland_observation_aliasing/summary.json
          if-no-files-found: warn
          retention-days: 30
