name: BAGI Existing Behavioral Cloning Pilot

on:
  push:
    branches: ["setup/initial-platform"]
    paths:
      - "bagi/experiments/xland_existing_bc.py"
      - "tests/test_xland_existing_bc.py"
      - "configs/xland_existing_bc.yaml"
      - ".github/workflows/bagi-existing-bc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-imitation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned existing benchmark and imitation algorithms
        run: pip install "xminigrid==0.9.3" "imitation==1.0.1" "pyyaml>=6" "pytest>=8" "ruff>=0.6"
      - name: Validate information boundary and experiment configuration
        run: |
          ruff check bagi/experiments/xland_existing_bc.py tests/test_xland_existing_bc.py
          python -m pytest -q tests/test_xland_existing_bc.py
      - name: Train existing BC learner on two vs three primitive demonstrations
        run: python -m bagi.experiments.xland_existing_bc --config configs/xland_existing_bc.yaml
      - name: Publish measured results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagi-existing-bc-pilot
          path: runs/xland_existing_bc/summary.json
          if-no-files-found: warn
          retention-days: 30
