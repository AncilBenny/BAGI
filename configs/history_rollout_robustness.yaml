# Gate B2: train/test observation-history lookup under varied executed paths.
environment:
  size: 9
  max_steps: 100
  view_size: 5
evaluation:
  seed: 12051
  guided_actions: [1, 1, 3, 3, 2, 2, 2, 2, 1, 1, 1, 1, 1, 1, 2, 2]
  prefix_steps: [0, 2, 4, 6, 8, 10, 12, 14]
  training_episodes_per_prefix: 20
  holdout_episodes_per_prefix: 10
  continuation_steps: 25
  history_windows: [0, 1, 2, 4, 8]
  output_dir: runs/history_rollout_robustness
