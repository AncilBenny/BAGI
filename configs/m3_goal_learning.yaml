# BAGI-M3 independent replication of M2; no M2 train/evaluation seeds reused.
# Same upstream PPO and RecurrentPPO models, hyperparameters and public inputs.
# Five prespecified deterministic/sampled evaluations, each with fresh seed split.
registered_study: m3
train_task: MiniGrid-MemoryS7-v0
transfer_task: MiniGrid-MemoryS13Random-v0
arms: [reactive, action4, frame4, recurrent]
training_seeds: [37, 53]
train_steps_per_arm_seed: 65536
rollout_steps: 128
batch_size: 64
epochs_per_rollout: 2
evaluation_seeds: [96001, 96002, 96003, 96004, 96005, 96006]
transfer_seeds: [97001, 97002, 97003, 97004, 97005, 97006]
max_eval_steps: 120
output_dir: runs/m3_goal_learning
