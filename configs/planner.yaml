seed: 42
environment:
  size: 9
  max_steps: 100
  view_size: 5
model:
  checkpoint: runs/world_model/world_model.pt
  hidden: 192
  cell_values: 9
  actions: 4
planning:
  horizon: 5
  candidates: 128
  gamma: 0.97
  # switch, key, lock, goal: increasingly valuable causal progress
  event_weights: [0.05, 0.10, 0.20, 1.00]
evaluation:
  episodes: 25
  training_transitions: runs/workshop_guided/transitions.jsonl
  output_dir: runs/planner
